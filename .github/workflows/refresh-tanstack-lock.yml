name: Refresh TanStack security lockfile

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/refresh-tanstack-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify TanStack security fixes
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const requirements = {
            '@tanstack/react-start': [1, 168, 60],
            '@tanstack/start-server-core': [1, 169, 39],
          };

          for (const [name, minimum] of Object.entries(requirements)) {
            const actual = lock.packages[`node_modules/${name}`]?.version;
            if (!actual) throw new Error(`Pacote ausente no lockfile: ${name}`);

            const version = actual.split('.').map(Number);
            const safe = version[0] > minimum[0]
              || (version[0] === minimum[0] && version[1] > minimum[1])
              || (version[0] === minimum[0] && version[1] === minimum[1] && version[2] >= minimum[2]);

            if (!safe) {
              throw new Error(`${name}@${actual} ainda está abaixo da versão corrigida ${minimum.join('.')}`);
            }
            console.log(`OK: ${name}@${actual}`);
          }
          NODE

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh TanStack security lockfile"
          git push origin main
